# SPDX-License-Identifier: Apache-2.0
# Builds the core and the reference backend and runs the tests that need no vendor SDK.
# Backends that need an SDK or hardware (QNN, ONNX Runtime, CoreML comparison) are tested
# by hand; see docs/agents/setup.md.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_C_FLAGS="-Wall -Wextra -Wpedantic -Werror"
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Install and use the installed library
        run: |
          cmake --install build --prefix "$PWD/prefix"
          cc -std=c11 -I prefix/include examples/quickstart.c -L prefix/lib -luairt -o quickstart_installed
          ./quickstart_installed

  coreml:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure with CoreML
        run: cmake -S . -B build -DUAIRT_BUILD_COREML=ON -DCMAKE_C_FLAGS="-Wall -Wextra -Wpedantic -Werror"
      - name: Build and run the error-path tests
        run: |
          cmake --build build
          ctest --test-dir build --output-on-failure

  # Windows x64 runs on GitHub's hosted runners. The presets name the Visual Studio 2022 generator, and windows-latest no longer
  # ships VS 2022, so the image is pinned. Warnings fail the build, like -Werror on the Linux and macOS jobs.
  windows-x64:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Check the toolchain
        shell: pwsh
        run: ./scripts/doctor.ps1
      - name: Configure
        run: cmake --preset windows-x64-debug "-DCMAKE_C_FLAGS=-W4 -WX" "-DCMAKE_CXX_FLAGS=-W4 -WX -EHsc"
      - name: Build
        run: cmake --build --preset windows-x64-debug
      - name: Test
        run: ctest --preset windows-x64-debug
      - name: Vendor-file check
        shell: bash
        run: bash scripts/check_no_vendor_files.sh

  # Windows ARM64 runs on GitHub's hosted windows-11-arm runner (free for public repositories). Its image has only
  # Visual Studio 2026, so the configure step overrides the preset's Visual Studio 2022 generator.
  windows-arm64:
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v4
      - name: Check the toolchain
        shell: pwsh
        run: ./scripts/doctor.ps1
      - name: Configure
        run: cmake --preset windows-arm64-debug -G "Visual Studio 18 2026" "-DCMAKE_C_FLAGS=-W4 -WX" "-DCMAKE_CXX_FLAGS=-W4 -WX -EHsc"
      - name: Build
        run: cmake --build --preset windows-arm64-debug
      - name: Test
        run: ctest --preset windows-arm64-debug
      - name: Vendor-file check
        shell: bash
        run: bash scripts/check_no_vendor_files.sh
