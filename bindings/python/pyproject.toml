# SPDX-License-Identifier: Apache-2.0
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "uairt"
version = "0.1.0"
description = "Python binding for the Unified AI Runtime C API"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.9"
dependencies = ["numpy>=1.21"]

[tool.setuptools]
packages = ["uairt"]
